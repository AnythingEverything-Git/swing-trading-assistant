
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["alembic*"]

[project]
name = "swing-trading-assistant"
version = "0.1.0"
description = "AI-assisted swing trading assistant (backend scaffold)"
readme = "README.md"
requires-python = ">=3.12"
authors = [ { name = "Your Name", email = "you@example.com" } ]

dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"pytest-asyncio>=0.23",
	"ruff>=0.8",
	"httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "venv", "frontend", "docs", "build", "dist", "node_modules"]

